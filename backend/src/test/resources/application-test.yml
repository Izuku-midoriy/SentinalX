spring:
  datasource:
    url: jdbc:h2:mem:sentinelx_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

detection:
  rules:
    brute-force:
      threshold: 3
      window-minutes: 5
    port-scan:
      threshold: 2
      window-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true

sentinelx:
  ai:
    enabled: true
    service-url: http://localhost:8000
    timeout-ms: 500

